# AEMX 버전 카탈로그
# 별칭의 하이픈(-)은 빌드 스크립트에서 점(.)으로 접근한다.
#   예) androidx-core-ktx  ->  libs.androidx.core.ktx
#       androidx-espresso-core -> libs.androidx.espresso.core
#       android-application -> libs.plugins.android.application

[versions]
agp = "8.7.3"
kotlin = "2.0.21"

androidx-core-ktx = "1.15.0"
androidx-appcompat = "1.7.0"
material = "1.12.0"
androidx-constraintlayout = "2.2.0"
androidx-activity-ktx = "1.9.3"
androidx-fragment-ktx = "1.8.5"
androidx-recyclerview = "1.3.2"
androidx-core-splashscreen = "1.0.1"

junit = "4.13.2"
androidx-junit = "1.2.1"
androidx-espresso-core = "3.6.1"

[libraries]
# --- 앱 런타임 ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment-ktx" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-core-splashscreen" }

# --- 테스트 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
